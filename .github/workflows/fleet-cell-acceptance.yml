name: Fleet cell acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fleet-cell-acceptance.yml"
      - "test/fixtures/cell-acceptance/**"

permissions:
  contents: read

concurrency:
  group: fleet-cell-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compose:
    name: Two isolated cells (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the local container engine
        run: docker --context default compose version
      - name: Build the disposable fixture image
        run: docker --context default build --pull --tag fleet-cell-fixture:ci test/fixtures/cell-acceptance/image
      - name: Verify survivor custody and no replay after restoring A
        env:
          FLEET_FIXTURE_REPO: ${{ github.workspace }}
          FLEET_CELL_IMAGE: fleet-cell-fixture:ci
        run: bash test/fixtures/cell-acceptance/run-linux.sh
