name: CI

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.8"
          cache: false
      - name: Check Git and lint workflows
        run: |
          version=$(git --version | awk '{print $3}')
          test "$(printf '%s\n' 2.44.0 "$version" | sort -V | head -1)" = 2.44.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color=false
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit -p tsconfig.test.json
      - name: Build and smoke-test the CLI
        run: |
          bun run build
          bun src/cli.ts --help

  security:
    name: Privacy, license and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.8"
          cache: false
      - run: bun scripts/privacy-scan.ts
      - run: bun run license:check
      - name: Scan PR commits without printing findings
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          cfg=$(mktemp)
          ignore=$(mktemp)
          trap 'rm -f "$cfg" "$ignore"' EXIT
          printf '[extend]\nuseDefault = true\n' >"$cfg"
          if "$(go env GOPATH)/bin/gitleaks" git --config "$cfg" \
            --gitleaks-ignore-path "$ignore" --ignore-gitleaks-allow --redact=100 \
            --exit-code 42 --log-opts="$BASE_SHA..$HEAD_SHA" . >/dev/null 2>&1; then
            echo "PR commit scan passed."
          else
            rc=$?
            if [ "$rc" -eq 42 ]; then
              echo "::error::Potential credential found; investigate privately."
            else
              echo "::error::Secret scan could not complete."
            fi
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: git --version
      - run: bun install --frozen-lockfile
      - run: bun test test

  gate:
    name: PR gate
    if: ${{ always() }}
    needs: [static, security, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all blocking jobs to succeed
        env:
          STATIC: ${{ needs.static.result }}
          SECURITY: ${{ needs.security.result }}
          TEST: ${{ needs.test.result }}
        run: |
          printf 'static=%s security=%s test=%s\n' "$STATIC" "$SECURITY" "$TEST"
          test "$STATIC" = success && test "$SECURITY" = success && test "$TEST" = success
